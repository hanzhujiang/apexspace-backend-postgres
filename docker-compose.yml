version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: apexspace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: apexspace_crm
      POSTGRES_USER: apexspace
      POSTGRES_PASSWORD: apexspace_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
